apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: messager-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/SuperNein/k8s-lab-messenger.git
    targetRevision: main
    path: k8s/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: messager-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
