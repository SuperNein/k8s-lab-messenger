apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: messager

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml

  - postgres-pvc.yaml
  - postgres.yaml

  - migrate-users-job.yaml
  - migrate-messages-job.yaml

  - user-service.yaml
  - message-service.yaml

  - bff.yaml
  - frontend.yaml
  - ingress.yaml

  - minio.yaml
  - minio-secret.yaml
  - minio-bootstrap-job.yaml

  - csi-s3-secret.yaml
  - s3-pv.yaml
  - s3-pvc.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: postgres-init-scripts
    files:
      - bootstrap/postgres-init/00-databases.sql

  - name: users-migrations-cm
    files:
      - ../../user-service/migrations/001_init.sql

  - name: messages-migrations-cm
    files:
      - ../../message-service/migrations/001_init.sql
      - ../../message-service/migrations/002_add_file_name.sql
