apiVersion: v1
kind: PersistentVolume
metadata:
  name: s3-pv-messager-uploads

spec:
  capacity:
    storage: 10Gi

  accessModes:
    - ReadWriteMany

  persistentVolumeReclaimPolicy: Retain

  mountOptions:
    - allow-delete
    - url=http://minio:9000
    - use_path_request_style

  csi:
    driver: ch.ctrox.csi.s3-driver

    volumeHandle: messager-uploads-handle

    nodePublishSecretRef:
      name: csi-s3-secret
      namespace: messager

    volumeAttributes:
      bucketName: messager-uploads
      mounter: rclone

      options: "--memory-limit 1000 --dir-mode 0777 --file-mode 0666 --endpoint http://minio:9000"
