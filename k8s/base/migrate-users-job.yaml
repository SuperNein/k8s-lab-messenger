apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-users

spec:
  backoffLimit: 3

  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: alpine:3.19
          imagePullPolicy: IfNotPresent
          command: [
            "sh",
            "-c",
            "until nc -z -v -w3 postgres-dev 5432; do echo 'Waiting for Postgres...'; sleep 2; done"
          ]

      containers:
        - name: migrate-users
          image: ghcr.io/kukymbr/goose-docker:latest

          env:
            - name: GOOSE_DRIVER
              value: postgres

            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef:
                  name: messager-db-secret
                  key: USER_DB_DSN

            - name: GOOSE_MIGRATION_DIR
              value: /migrations

          volumeMounts:
            - name: migrations
              mountPath: /migrations

      volumes:
        - name: migrations
          configMap:
            name: users-migrations-cm
