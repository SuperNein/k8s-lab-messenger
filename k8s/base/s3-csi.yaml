apiVersion: v1
kind: Secret
metadata:
  name: csi-s3-secret

type: Opaque

stringData:
  accessKeyID: "minioadmin"
  secretAccessKey: "minioadmin123"

---

apiVersion: v1
kind: Secret
metadata:
  name: minio-secret

type: Opaque

stringData:
  accessKeyID: "minioadmin"
  secretAccessKey: "minioadmin123"

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: s3-pv-messager-uploads

spec:
  storageClassName: standard
  capacity:
    storage: 10Gi

  accessModes:
    - ReadWriteMany

  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/messager-uploads

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: message-uploads-pvc

spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  volumeName: s3-pv-messager-uploads
